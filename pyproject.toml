[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ───────────────────────────────────────────────────────

[project]
name = "workplace-stress-letterbox"
version = "1.0.0"
description = "A privacy-first, locally hosted workplace stress logging system"
requires-python = ">=3.10"
readme = "README.md"

# Install all dependencies (client + server together for dev convenience).
# For production, install requirements-client.txt or requirements-server.txt
# separately on the appropriate machine.
dependencies = [
    "PyQt6==6.11.0",
    "PyQt6-Qt6==6.11.0",
    "pystray==0.19.5",
    "Pillow==13.0.0",
    "requests==2.33.1",
    "bcrypt==5.0.0",
    "PyYAML==6.0.3",
    "appdirs==1.4.4",
    "Flask==3.1.3",
    "SQLAlchemy==2.0.49",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
# Run the client from anywhere after pip install -e .
letterbox-client = "client.main:main"
# Run the server
letterbox-server = "server.app:main"

# ── Package discovery ──────────────────────────────────────────────────────

[tool.setuptools.packages.find]
include = ["client*", "server*", "shared*"]

# ── Development tools ──────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
